# based on
# https://github.com/NixOS/nixpkgs/blob/master/pkgs/by-name/mi/miniupnpc/package.nix

context:
  version: "2.3.3"
  sha256: "8cf2c833b3e76fc4893ff29c2a376e3394962449e5970e373c0a91421724d222"
  # FIXME expected a scalar value
  # prefix_var: {"if":"win","then":"%PREFIX%","else":"$PREFIX"}
  # src_dir_var: {"if":"win","then":"%SRC_DIR%\\miniupnpc","else":"$SRC_DIR/miniupnpc"}
  prefix_var_expr: '{"if":"win","then":"%PREFIX%","else":"$PREFIX"}'
  src_dir_var_expr: '{"if":"win","then":"%SRC_DIR%\\miniupnpc","else":"$SRC_DIR/miniupnpc"}'
  cmake_flags: "-DCMAKE_BUILD_TYPE=Release -DUPNPC_BUILD_SHARED=yes -DUPNPC_BUILD_STATIC=no"

package:
  name: miniupnpc
  version: ${{ version }}

source:
  url: https://github.com/miniupnp/miniupnp/archive/refs/tags/miniupnpc_${{ version | replace(".", "_") }}.tar.gz
  sha256: ${{ sha256 }}
  # src_subdir: miniupnpc # TODO append "/miniupnpc" to $SRC_DIR

build:
  number: 0
  script:
    - {"if":"win","then":"echo on","else":"set -x"} # trace commands
    # - cmake ${{ src_dir_var }} -DCMAKE_INSTALL_PREFIX=${{ prefix_var }} -DCMAKE_BUILD_TYPE=Release -DUPNPC_BUILD_SHARED=yes -DUPNPC_BUILD_STATIC=no
    # - cmake ${{ src_dir_var_expr | eval }} -DCMAKE_INSTALL_PREFIX=${{ prefix_var_expr | eval }} -DCMAKE_BUILD_TYPE=Release -DUPNPC_BUILD_SHARED=yes -DUPNPC_BUILD_STATIC=no
    # - cmake ${{ "%SRC_DIR%\\miniupnpc" if win else "$SRC_DIR/miniupnpc" }} -DCMAKE_INSTALL_PREFIX=${{ "%PREFIX%" if win else "$PREFIX" }} -DCMAKE_BUILD_TYPE=Release -DUPNPC_BUILD_SHARED=yes -DUPNPC_BUILD_STATIC=no
    - if: win
      then: cmake %SRC_DIR%\\miniupnpc -DCMAKE_INSTALL_PREFIX=%PREFIX% ${{ cmake_flags }}
      else: cmake $SRC_DIR/miniupnpc -DCMAKE_INSTALL_PREFIX=$PREFIX ${{ cmake_flags }}
    - cmake --build . --config Release
    - cmake --install . --config Release
    - if: win
      then: |
        move %PREFIX%\\bin\\upnpc-shared.exe %PREFIX%\\bin\\upnpc.exe
        move %PREFIX%\\bin\\upnp-listdevices-shared.exe %PREFIX%\\bin\\upnp-listdevices.exe
        rm %PREFIX%\\bin\\external-ip.sh
      else: |
        mv -v $PREFIX/bin/upnpc-shared $PREFIX/bin/upnpc
        mv -v $PREFIX/bin/upnp-listdevices-shared $PREFIX/bin/upnp-listdevices
        rm -v $PREFIX/bin/external-ip.sh

requirements:
  build:
    - cmake
    - make
    - ${{ compiler('c') }}
    # FIXME
    # Unsatisfiable dependencies for platform linux-64: {MatchSpec("c_linux-64")}
    # Encountered problems while solving:
    #   - nothing provides requested c_linux-64
    # The following package could not be installed
    # └─ c_linux-64 does not exist (perhaps a typo or a missing channel).
    - ${{ stdlib("c") }}

tests:
  - script:
    # - upnpc --version # no, this tries to find UPNP devices...
    - upnpc --help

about:
  homepage: https://github.com/miniupnp/miniupnp
  license: BSD-3-Clause
  license_file: LICENSE
  summary: "UPnP IGD client library"

extra:
  recipe-maintainers:
    - nobody
